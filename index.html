<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iOS Compatible Loop Station</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #121216;
      color: #f0f0f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem 0.5rem;
    }

    h1 {
      margin: 0 0 0.25rem 0;
      font-size: 1.8rem;
      background: linear-gradient(135deg, #ff3b30, #ff9500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: #a0a0ab;
      margin-top: 0;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }

    .main-container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel {
      background: #1c1c22;
      padding: 1rem;
      border-radius: 16px;
      border: 1px solid #2e2e38;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .routing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.8rem;
      align-items: center;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .field-group label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8e8e93;
    }

    select, input[type="range"] {
      background: #2c2c36;
      color: #fff;
      border: 1px solid #3a3a48;
      border-radius: 8px;
      padding: 0.5rem;
      font-size: 0.85rem;
      outline: none;
    }

    button {
      background: #ff3b30;
      color: white;
      border: none;
      padding: 0.65rem 0.8rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    button:hover { background: #e03228; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.mic-on { background: #34c759; }
    button.secondary { background: #2c2c36; color: #d0d0d8; border: 1px solid #3a3a48; }
    button.secondary:hover { background: #3a3a48; }
    button.active-toggle { background: #ff9500; color: #121216; }
    button.muted { background: #ff9500; color: #121216; }
    button.export-btn { background: #007aff; }

    button.btn-rec { background: #ff3b30; color: white; }
    button.btn-play { background: #34c759; color: white; }
    button.btn-overdub { background: #ff9500; color: #121216; }

    .val-readout {
      font-size: 0.75rem;
      font-weight: bold;
      color: #ff9500;
    }

    .mixer-header {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 0.8rem;
      color: #ff9500;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mixer-strips {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
    }

    @media (max-width: 820px) {
      .mixer-strips { grid-template-columns: repeat(2, 1fr); }
    }

    .channel-strip {
      background: #141418;
      border: 1px solid #2e2e38;
      border-radius: 12px;
      padding: 0.7rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .strip-title {
      font-size: 0.85rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2c2c36;
      padding-bottom: 0.3rem;
    }

    .layer-count {
      font-size: 0.65rem;
      background: #2c2c36;
      padding: 2px 6px;
      border-radius: 10px;
      color: #aaa;
    }

    .fader-meter-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      height: 90px;
      margin: 0.2rem 0;
    }

    input[type="range"].v-fader {
      -webkit-appearance: slider-vertical;
      width: 16px;
      height: 100%;
      background: #2c2c36;
    }

    .vu-meter {
      width: 8px;
      height: 100%;
      background: #222;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
    }

    .vu-fill {
      width: 100%;
      height: 0%;
      background: linear-gradient(to top, #34c759 60%, #ff9500 85%, #ff3b30 100%);
      transition: height 0.05s ease;
    }

    .waveform-mini {
      width: 100%;
      height: 30px;
      background: #0d0d10;
      border-radius: 6px;
      border: 1px solid #262630;
    }

    .knob-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.3rem;
    }

    .knob-control {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .knob-control label { font-size: 0.6rem; color: #8e8e93; }
    .knob-control input { width: 100%; }

    .action-row { display: flex; gap: 0.3rem; }
    .action-row button { flex: 1; padding: 0.4rem 0.2rem; font-size: 0.7rem; }

    .status-badge {
      font-size: 0.65rem;
      text-align: center;
      font-weight: bold;
      text-transform: uppercase;
      padding: 2px 0;
      border-radius: 4px;
      background: #222;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>🎛️ iOS Loop Station Pro</h1>
  <p class="subtitle">Lightning & Headset Optimized • Master Loop Sync</p>
  
  <div class="main-container">
    
    <!-- 1. Audio Setup -->
    <div class="panel">
      <div class="routing-grid">
        <div class="field-group">
          <label>Eingabe-Quelle (Mikrofon):</label>
          <select id="mic-select"><option value="">Standard Mikrofon</option></select>
        </div>

        <div class="field-group">
          <label>iOS Ausgabemodus:</label>
          <select id="speaker-select" disabled><option value="">Auto (Lightning / Headset)</option></select>
        </div>

        <div class="field-group">
          <label>Preamp Boost (Mikrofon-Pegel):</label>
          <input type="range" id="preamp-gain" min="1" max="6" step="0.1" value="3">
          <span class="val-readout" id="preamp-val">300% Boost</span>
        </div>

        <button id="init-audio-btn" style="height: 38px; margin-top: auto;">🎙️ Engine Entriegeln</button>
      </div>
    </div>

    <!-- 2. Global Control -->
    <div class="panel" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.8rem;">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <button id="metronome-btn" class="secondary">⏱️ Metronom</button>
        <input type="range" id="bpm-slider" min="60" max="200" value="120" style="width: 80px;">
        <span class="val-readout" id="bpm-val">120 BPM</span>
      </div>

      <div style="display: flex; gap: 0.4rem;">
        <button id="record-mix-btn" class="export-btn">🔴 Mix Aufnehmen</button>
        <button id="clear-all-btn" class="secondary">🗑️ Reset</button>
      </div>
    </div>

    <!-- 3. Loop Station / Mixer -->
    <div class="panel">
      <div class="mixer-header">
        <span>🔄 Live Loop Mixer</span>
        <span style="font-size: 0.75rem; color: #8e8e93;" id="ios-info">Audio Inaktiv</span>
      </div>

      <div class="mixer-strips">
        <!-- Channel 0 -->
        <div class="channel-strip" id="strip-0">
          <div class="strip-title"><span>CH 1</span><span class="layer-count" id="layer-count-0">0</span></div>
          <canvas class="waveform-mini" id="canvas-0"></canvas>
          <div class="status-badge" id="status-0">EMPTY</div>
          <button class="btn-rec" onclick="handleMainAction(0)" id="main-btn-0">⏺️ REC</button>
          <div class="action-row">
            <button class="secondary" onclick="stopLoop(0)" id="stop-btn-0" disabled>⏹️</button>
            <button class="secondary" onclick="undoLayer(0)" id="undo-btn-0" disabled>↩️</button>
            <button class="secondary" onclick="redoLayer(0)" id="redo-btn-0" disabled>↪️</button>
          </div>
          <div class="fader-meter-wrapper">
            <input type="range" class="v-fader" id="fader-0" min="0" max="4" step="0.05" value="1.5" oninput="updateVolume(0, this.value)">
            <div class="vu-meter"><div class="vu-fill" id="vu-0"></div></div>
          </div>
          <div class="val-readout" style="text-align: center;" id="vol-val-0">150%</div>
          <div class="knob-grid">
            <div class="knob-control"><label>Bass</label><input type="range" min="-12" max="12" value="0" step="1" oninput="updateEQ(0, 'bass', this.value)"></div>
            <div class="knob-control"><label>Treble</label><input type="range" min="-12" max="12" value="0" step="1" oninput="updateEQ(0, 'treble', this.value)"></div>
          </div>
          <div class="knob-control"><label>Pan</label><input type="range" min="-1" max="1" value="0" step="0.1" oninput="updatePan(0, this.value)"></div>
          <div class="action-row">
            <button class="secondary" id="mute-btn-0" onclick="toggleMute(0)">Mute</button>
            <button class="secondary" onclick="clearTrack(0)">Clear</button>
          </div>
        </div>

        <!-- Channel 1 -->
        <div class="channel-strip" id="strip-1">
          <div class="strip-title"><span>CH 2</span><span class="layer-count" id="layer-count-1">0</span></div>
          <canvas class="waveform-mini" id="canvas-1"></canvas>
          <div class="status-badge" id="status-1">EMPTY</div>
          <button class="btn-rec" onclick="handleMainAction(1)" id="main-btn-1">⏺️ REC</button>
          <div class="action-row">
            <button class="secondary" onclick="stopLoop(1)" id="stop-btn-1" disabled>⏹️</button>
            <button class="secondary" onclick="undoLayer(1)" id="undo-btn-1" disabled>↩️</button>
            <button class="secondary" onclick="redoLayer(1)" id="redo-btn-1" disabled>↪️</button>
          </div>
          <div class="fader-meter-wrapper">
            <input type="range" class="v-fader" id="fader-1" min="0" max="4" step="0.05" value="1.5" oninput="updateVolume(1, this.value)">
            <div class="vu-meter"><div class="vu-fill" id="vu-1"></div></div>
          </div>
          <div class="val-readout" style="text-align: center;" id="vol-val-1">150%</div>
          <div class="knob-grid">
            <div class="knob-control"><label>Bass</label><input type="range" min="-12" max="12" value="0" step="1" oninput="updateEQ(1, 'bass', this.value)"></div>
            <div class="knob-control"><label>Treble</label><input type="range" min="-12" max="12" value="0" step="1" oninput="updateEQ(1, 'treble', this.value)"></div>
          </div>
          <div class="knob-control"><label>Pan</label><input type="range" min="-1" max="1" value="0" step="0.1" oninput="updatePan(1, this.value)"></div>
          <div class="action-row">
            <button class="secondary" id="mute-btn-1" onclick="toggleMute(1)">Mute</button>
            <button class="secondary" onclick="clearTrack(1)">Clear</button>
          </div>
        </div>

        <!-- Channel 2 -->
        <div class="channel-strip" id="strip-2">
          <div class="strip-title"><span>CH 3</span><span class="layer-count" id="layer-count-2">0</span></div>
          <canvas class="waveform-mini" id="canvas-2"></canvas>
          <div class="status-badge" id="status-2">EMPTY</div>
          <button class="btn-rec" onclick="handleMainAction(2)" id="main-btn-2">⏺️ REC</button>
          <div class="action-row">
            <button class="secondary" onclick="stopLoop(2)" id="stop-btn-2" disabled>⏹️</button>
            <button class="secondary" onclick="undoLayer(2)" id="undo-btn-2" disabled>↩️</button>
            <button class="secondary" onclick="redoLayer(2)" id="redo-btn-2" disabled>↪️</button>
          </div>
          <div class="fader-meter-wrapper">
            <input type="range" class="v-fader" id="fader-2" min="0" max="4" step="0.05" value="1.5" oninput="updateVolume(2, this.value)">
            <div class="vu-meter"><div class="vu-fill" id="vu-2"></div></div>
          </div>
          <div class="val-readout" style="text-align: center;" id="vol-val-2">150%</div>
          <div class="knob-grid">
            <div class="knob-control"><label>Bass</label><input type="range" min="-12" max="12" value="0" step="1" oninput="updateEQ(2, 'bass', this.value)"></div>
            <div class="knob-control"><label>Treble</label><input type="range" min="-12" max="12" value="0" step="1" oninput="updateEQ(2, 'treble', this.value)"></div>
          </div>
          <div class="knob-control"><label>Pan</label><input type="range" min="-1" max="1" value="0" step="0.1" oninput="updatePan(2, this.value)"></div>
          <div class="action-row">
            <button class="secondary" id="mute-btn-2" onclick="toggleMute(2)">Mute</button>
            <button class="secondary" onclick="clearTrack(2)">Clear</button>
          </div>
        </div>

        <!-- Channel 3 -->
        <div class="channel-strip" id="strip-3">
          <div class="strip-title"><span>CH 4</span><span class="layer-count" id="layer-count-3">0</span></div>
          <canvas class="waveform-mini" id="canvas-3"></canvas>
          <div class="status-badge" id="status-3">EMPTY</div>
          <button class="btn-rec" onclick="handleMainAction(3)" id="main-btn-3">⏺️ REC</button>
          <div class="action-row">
            <button class="secondary" onclick="stopLoop(3)" id="stop-btn-3" disabled>⏹️</button>
            <button class="secondary" onclick="undoLayer(3)" id="undo-btn-3" disabled>↩️</button>
            <button class="secondary" onclick="redoLayer(3)" id="redo-btn-3" disabled>↪️</button>
          </div>
          <div class="fader-meter-wrapper">
            <input type="range" class="v-fader" id="fader-3" min="0" max="4" step="0.05" value="1.5" oninput="updateVolume(3, this.value)">
            <div class="vu-meter"><div class="vu-fill" id="vu-3"></div></div>
          </div>
          <div class="val-readout" style="text-align: center;" id="vol-val-3">150%</div>
          <div class="knob-grid">
            <div class="knob-control"><label>Bass</label><input type="range" min="-12" max="12" value="0" step="1" oninput="updateEQ(3, 'bass', this.value)"></div>
            <div class="knob-control"><label>Treble</label><input type="range" min="-12" max="12" value="0" step="1" oninput="updateEQ(3, 'treble', this.value)"></div>
          </div>
          <div class="knob-control"><label>Pan</label><input type="range" min="-1" max="1" value="0" step="0.1" oninput="updatePan(3, this.value)"></div>
          <div class="action-row">
            <button class="secondary" id="mute-btn-3" onclick="toggleMute(3)">Mute</button>
            <button class="secondary" onclick="clearTrack(3)">Clear</button>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    let audioContext = null;
    let rawMicStream = null;
    let audioStream = null;
    let inputPreampNode = null;
    let masterBusNode = null;
    let mixDestinationNode = null;
    
    let mixRecorder = null;
    let mixChunks = [];
    let isRecordingMix = false;

    let isMetronomeOn = false;
    let metronomeInterval = null;
    let currentBpm = 120;

    // Master Sync Steuerung
    let masterLoopDuration = null; // Länge in Sekunden der 1. Aufnahme
    let masterStartTime = null;    // Phasen-Referenz für die Synchronisation

    const tracks = Array.from({ length: 4 }, () => ({
      state: 'EMPTY',
      layers: [], // Speichert { buffer, sourceNode }
      redoStack: [],
      recorder: null,
      chunks: [],
      
      channelGainNode: null,
      bassNode: null,
      trebleNode: null,
      pannerNode: null,
      analyserNode: null,
      
      volume: 1.5,
      isMuted: false
    }));

    const micSelect = document.getElementById('mic-select');
    const initAudioBtn = document.getElementById('init-audio-btn');
    const preampGainInput = document.getElementById('preamp-gain');
    const preampVal = document.getElementById('preamp-val');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmVal = document.getElementById('bpm-val');
    const metronomeBtn = document.getElementById('metronome-btn');
    const recordMixBtn = document.getElementById('record-mix-btn');
    const iosInfo = document.getElementById('ios-info');

    async function getDevices() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        micSelect.innerHTML = '';
        devices.forEach(device => {
          if (device.kind === 'audioinput') {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.text = device.label || `Eingang ${micSelect.length + 1}`;
            micSelect.appendChild(option);
          }
        });
      } catch (e) { console.error("Device listing error:", e); }
    }

    // Engine Entriegeln mit iOS-robusten Fallbacks
    initAudioBtn.addEventListener('click', async () => {
      try {
        // 1. AudioContext aufbauen & entsperren
        if (!audioContext) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioContext = new AudioContextClass({ latencyHint: 'interactive' });
        }

        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        // Dummy-Sound schaltet iOS Lightning Routing frei
        const dummyOsc = audioContext.createOscillator();
        const dummyGain = audioContext.createGain();
        dummyGain.gain.value = 0.001;
        dummyOsc.connect(dummyGain);
        dummyGain.connect(audioContext.destination);
        dummyOsc.start();
        dummyOsc.stop(audioContext.currentTime + 0.05);

        // Master-Busse initialisieren
        masterBusNode = audioContext.createGain();
        masterBusNode.gain.value = 1.0;
        masterBusNode.connect(audioContext.destination);

        mixDestinationNode = audioContext.createMediaStreamDestination();
        masterBusNode.connect(mixDestinationNode);

        // Mixer-Kanäle aufbauen
        tracks.forEach((track, i) => {
          track.bassNode = audioContext.createBiquadFilter();
          track.bassNode.type = 'lowshelf';
          track.bassNode.frequency.value = 250;

          track.trebleNode = audioContext.createBiquadFilter();
          track.trebleNode.type = 'highshelf';
          track.trebleNode.frequency.value = 4000;

          track.pannerNode = audioContext.createStereoPanner();
          track.channelGainNode = audioContext.createGain();
          track.channelGainNode.gain.value = track.volume;

          track.analyserNode = audioContext.createAnalyser();
          track.analyserNode.fftSize = 64;

          track.bassNode
            .connect(track.trebleNode)
            .connect(track.pannerNode)
            .connect(track.channelGainNode)
            .connect(track.analyserNode)
            .connect(masterBusNode);
            
          startVUMeter(i);
        });

        // 2. Mikrofon-Eingang aktivieren
        await setupInputStream();
        await getDevices();

        initAudioBtn.textContent = '✓ Engine Aktiv';
        initAudioBtn.classList.add('mic-on');
        iosInfo.textContent = 'iOS Audio-Engine Bereit';
        iosInfo.style.color = '#34c759';
      } catch (err) {
        alert('Hardware-Fehler: Bitte erlaube den Mikrofon-Zugriff in Safari.');
        console.error("Audio Init Error:", err);
      }
    });

    async function setupInputStream() {
      if (rawMicStream) {
        rawMicStream.getTracks().forEach(t => t.stop());
      }

      const selectedMicId = micSelect.value;
      
      // Fallback-Abfrage falls strikte Constraints auf iOS fehlschlagen
      try {
        const constraints = {
          audio: selectedMicId ? { deviceId: { exact: selectedMicId } } : true
        };
        rawMicStream = await navigator.mediaDevices.getUserMedia(constraints);
      } catch (err) {
        console.warn("Strikte Audio-Constraints fehlgeschlagen, nutze Standard-Eingang:", err);
        rawMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      }

      const micSource = audioContext.createMediaStreamSource(rawMicStream);
      
      inputPreampNode = audioContext.createGain();
      inputPreampNode.gain.value = parseFloat(preampGainInput.value);

      const boostedDestination = audioContext.createMediaStreamDestination();
      micSource.connect(inputPreampNode);
      inputPreampNode.connect(boostedDestination);

      audioStream = boostedDestination.stream;
    }

    micSelect.addEventListener('change', async () => {
      if (audioContext) await setupInputStream();
    });

    preampGainInput.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      preampVal.textContent = Math.round(val * 100) + '% Boost';
      if (inputPreampNode && audioContext) {
        inputPreampNode.gain.setValueAtTime(val, audioContext.currentTime);
      }
    });

    function handleMainAction(index) {
      if (!audioStream || !audioContext) return alert('Bitte zuerst die Engine entriegeln!');

      const track = tracks[index];

      switch (track.state) {
        case 'EMPTY':
          startFirstRecording(index);
          break;
        case 'RECORDING':
          stopRecordingAndPlay(index);
          break;
        case 'PLAYING':
        case 'STOPPED':
          startOverdub(index);
          break;
        case 'OVERDUBBING':
          stopOverdubAndPlay(index);
          break;
      }
    }

    function startFirstRecording(index) {
      const track = tracks[index];
      track.chunks = [];
      track.redoStack = [];

      let options = {};
      if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4' };
      else if (MediaRecorder.isTypeSupported('audio/aac')) options = { mimeType: 'audio/aac' };

      track.recorder = new MediaRecorder(audioStream, options);
      track.recorder.ondataavailable = e => { if (e.data.size > 0) track.chunks.push(e.data); };

      track.recorder.onstop = async () => {
        const blob = new Blob(track.chunks, { type: track.recorder.mimeType || 'audio/mp4' });
        const arrayBuffer = await blob.arrayBuffer();
        let audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

        // Master-Länge setzen beim allerersten Loop
        if (masterLoopDuration === null) {
          masterLoopDuration = audioBuffer.duration;
          masterStartTime = audioContext.currentTime;
          iosInfo.textContent = `Master Sync: ${masterLoopDuration.toFixed(2)}s`;
        } else {
          audioBuffer = cropOrPadToMasterLength(audioBuffer);
        }

        await addLayerToTrack(index, audioBuffer);
        renderWaveform(index, audioBuffer);
        playLoop(index);
      };

      track.recorder.start(100);
      track.state = 'RECORDING';
      updateUI(index);
    }

    function stopRecordingAndPlay(index) {
      const track = tracks[index];
      track.recorder.stop();
      track.state = 'PLAYING';
      updateUI(index);
    }

    function startOverdub(index) {
      const track = tracks[index];
      if (track.state === 'STOPPED') playLoop(index);

      track.chunks = [];
      track.redoStack = [];

      let options = {};
      if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4' };

      track.recorder = new MediaRecorder(audioStream, options);
      track.recorder.ondataavailable = e => { if (e.data.size > 0) track.chunks.push(e.data); };

      track.recorder.onstop = async () => {
        const blob = new Blob(track.chunks, { type: track.recorder.mimeType || 'audio/mp4' });
        const arrayBuffer = await blob.arrayBuffer();
        let audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

        if (masterLoopDuration !== null) {
          audioBuffer = cropOrPadToMasterLength(audioBuffer);
        }

        await addLayerToTrack(index, audioBuffer);
      };

      track.recorder.start(100);
      track.state = 'OVERDUBBING';
      updateUI(index);
    }

    function stopOverdubAndPlay(index) {
      const track = tracks[index];
      track.recorder.stop();
      track.state = 'PLAYING';
      updateUI(index);
    }

    // Passt Folgespuren präzise an die Länge der 1. Aufnahme an
    function cropOrPadToMasterLength(sourceBuffer) {
      if (!masterLoopDuration) return sourceBuffer;

      const sampleRate = sourceBuffer.sampleRate;
      const targetLength = Math.floor(masterLoopDuration * sampleRate);
      const newBuffer = audioContext.createBuffer(
        sourceBuffer.numberOfChannels,
        targetLength,
        sampleRate
      );

      for (let channel = 0; channel < sourceBuffer.numberOfChannels; channel++) {
        const srcData = sourceBuffer.getChannelData(channel);
        const destData = newBuffer.getChannelData(channel);
        
        for (let i = 0; i < targetLength; i++) {
          destData[i] = i < srcData.length ? srcData[i] : 0;
        }
      }
      return newBuffer;
    }

    async function addLayerToTrack(index, audioBuffer) {
      const track = tracks[index];
      const layerObj = { buffer: audioBuffer, sourceNode: null };
      track.layers.push(layerObj);

      if (track.state === 'PLAYING' || track.state === 'OVERDUBBING') {
        playSingleLayer(index, layerObj);
      }

      updateUI(index);
    }

    function playLoop(index) {
      const track = tracks[index];
      if (track.layers.length === 0) return;

      stopAllLayerNodes(index);
      track.layers.forEach(layer => playSingleLayer(index, layer));

      track.state = 'PLAYING';
      updateUI(index);
    }

    function playSingleLayer(index, layer) {
      const track = tracks[index];
      const source = audioContext.createBufferSource();
      source.buffer = layer.buffer;
      source.loop = true;
      source.connect(track.bassNode);

      // Synchrone Taktberechnung zur Master-Zeit
      if (masterStartTime !== null && masterLoopDuration) {
        const elapsedTime = audioContext.currentTime - masterStartTime;
        const offset = elapsedTime % masterLoopDuration;
        source.start(0, offset);
      } else {
        source.start(0);
      }

      layer.sourceNode = source;
    }

    function stopAllLayerNodes(index) {
      const track = tracks[index];
      track.layers.forEach(layer => {
        if (layer.sourceNode) {
          try { layer.sourceNode.stop(); layer.sourceNode.disconnect(); } catch (e) {}
          layer.sourceNode = null;
        }
      });
    }

    function stopLoop(index) {
      const track = tracks[index];
      if (track.state === 'OVERDUBBING' && track.recorder) {
        track.recorder.stop();
      }

      stopAllLayerNodes(index);
      track.state = 'STOPPED';
      updateUI(index);
    }

    function undoLayer(index) {
      const track = tracks[index];
      if (track.layers.length === 0) return;

      const removed = track.layers.pop();
      if (removed.sourceNode) {
        try { removed.sourceNode.stop(); removed.sourceNode.disconnect(); } catch (e) {}
      }

      track.redoStack.push(removed);

      if (track.layers.length === 0) {
        track.state = 'EMPTY';
        clearCanvas(index);
        checkAndResetMasterSync();
      }

      updateUI(index);
    }

    function redoLayer(index) {
      const track = tracks[index];
      if (track.redoStack.length === 0) return;

      const restored = track.redoStack.pop();
      track.layers.push(restored);

      if (track.state === 'PLAYING') {
        playSingleLayer(index, restored);
      } else if (track.state === 'STOPPED' || track.state === 'EMPTY') {
        playLoop(index);
      }

      updateUI(index);
    }

    function clearTrack(index) {
      const track = tracks[index];
      if (track.recorder && track.recorder.state !== 'inactive') {
        track.recorder.stop();
      }

      stopAllLayerNodes(index);
      track.layers = [];
      track.redoStack = [];
      track.state = 'EMPTY';

      clearCanvas(index);
      updateUI(index);
      checkAndResetMasterSync();
    }

    function checkAndResetMasterSync() {
      const allEmpty = tracks.every(t => t.layers.length === 0);
      if (allEmpty) {
        masterLoopDuration = null;
        masterStartTime = null;
        iosInfo.textContent = 'iOS Audio-Engine Bereit';
      }
    }

    function updateUI(index) {
      const track = tracks[index];
      const mainBtn = document.getElementById(`main-btn-${index}`);
      const stopBtn = document.getElementById(`stop-btn-${index}`);
      const undoBtn = document.getElementById(`undo-btn-${index}`);
      const redoBtn = document.getElementById(`redo-btn-${index}`);
      const statusBadge = document.getElementById(`status-${index}`);
      const layerCount = document.getElementById(`layer-count-${index}`);

      statusBadge.textContent = track.state;
      layerCount.textContent = `${track.layers.length}`;

      switch (track.state) {
        case 'EMPTY':
          mainBtn.textContent = '⏺️ REC';
          mainBtn.className = 'btn-rec';
          stopBtn.disabled = true;
          break;
        case 'RECORDING':
          mainBtn.textContent = '⏹️ END LOOP';
          mainBtn.className = 'btn-play';
          stopBtn.disabled = false;
          break;
        case 'PLAYING':
          mainBtn.textContent = '🟠 OVERDUB';
          mainBtn.className = 'btn-overdub';
          stopBtn.disabled = false;
          break;
        case 'OVERDUBBING':
          mainBtn.textContent = '▶️ PLAY (LOCK)';
          mainBtn.className = 'btn-play';
          stopBtn.disabled = false;
          break;
        case 'STOPPED':
          mainBtn.textContent = '▶️ PLAY';
          mainBtn.className = 'btn-play';
          stopBtn.disabled = true;
          break;
      }

      undoBtn.disabled = track.layers.length === 0;
      redoBtn.disabled = track.redoStack.length === 0;
    }

    function updateVolume(index, val) {
      const num = parseFloat(val);
      tracks[index].volume = num;
      document.getElementById(`vol-val-${index}`).textContent = Math.round(num * 100) + '%';
      if (tracks[index].channelGainNode && !tracks[index].isMuted) {
        tracks[index].channelGainNode.gain.setValueAtTime(num, audioContext.currentTime);
      }
    }

    function updateEQ(index, type, val) {
      const num = parseFloat(val);
      if (type === 'bass' && tracks[index].bassNode) {
        tracks[index].bassNode.gain.setValueAtTime(num, audioContext.currentTime);
      } else if (type === 'treble' && tracks[index].trebleNode) {
        tracks[index].trebleNode.gain.setValueAtTime(num, audioContext.currentTime);
      }
    }

    function updatePan(index, val) {
      if (tracks[index].pannerNode) {
        tracks[index].pannerNode.pan.setValueAtTime(parseFloat(val), audioContext.currentTime);
      }
    }

    function toggleMute(index) {
      const track = tracks[index];
      const btn = document.getElementById(`mute-btn-${index}`);
      track.isMuted = !track.isMuted;

      if (track.channelGainNode) {
        track.channelGainNode.gain.setValueAtTime(track.isMuted ? 0 : track.volume, audioContext.currentTime);
      }

      btn.textContent = track.isMuted ? 'Unmute' : 'Mute';
      btn.classList.toggle('muted', track.isMuted);
    }

    function startVUMeter(index) {
      const track = tracks[index];
      const vuFill = document.getElementById(`vu-${index}`);
      const dataArray = new Uint8Array(track.analyserNode.frequencyBinCount);

      function updateMeter() {
        if (track.state === 'PLAYING' || track.state === 'OVERDUBBING') {
          track.analyserNode.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          let average = sum / dataArray.length;
          let pct = Math.min(100, Math.round((average / 128) * 100));
          vuFill.style.height = pct + '%';
        } else {
          vuFill.style.height = '0%';
        }
        requestAnimationFrame(updateMeter);
      }
      updateMeter();
    }

    function renderWaveform(index, audioBuffer) {
      const canvas = document.getElementById(`canvas-${index}`);
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;

      const rawData = audioBuffer.getChannelData(0);
      const samples = 35;
      const blockSize = Math.floor(rawData.length / samples);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff9500';

      const barWidth = canvas.width / samples;
      for (let i = 0; i < samples; i++) {
        let sum = 0;
        for (let j = 0; j < blockSize; j++) sum += Math.abs(rawData[i * blockSize + j]);
        const barHeight = Math.max(2, (sum / blockSize) * canvas.height * 2);
        ctx.fillRect(i * barWidth, (canvas.height - barHeight) / 2, barWidth - 1, barHeight);
      }
    }

    function clearCanvas(index) {
      const canvas = document.getElementById(`canvas-${index}`);
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    document.getElementById('clear-all-btn').addEventListener('click', () => {
      tracks.forEach((_, i) => clearTrack(i));
    });

    bpmSlider.addEventListener('input', (e) => {
      currentBpm = parseInt(e.target.value);
      bpmVal.textContent = currentBpm + ' BPM';
      if (isMetronomeOn) restartMetronome();
    });

    metronomeBtn.addEventListener('click', () => {
      if (!audioContext) return alert('Bitte zuerst Engine entriegeln!');
      isMetronomeOn = !isMetronomeOn;
      metronomeBtn.classList.toggle('active-toggle', isMetronomeOn);
      isMetronomeOn ? startMetronome() : stopMetronome();
    });

    function startMetronome() {
      playClick();
      metronomeInterval = setInterval(playClick, (60 / currentBpm) * 1000);
    }
    function stopMetronome() { clearInterval(metronomeInterval); }
    function restartMetronome() { stopMetronome(); startMetronome(); }

    function playClick() {
      if (!audioContext) return;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.frequency.setValueAtTime(1000, audioContext.currentTime);
      gain.gain.setValueAtTime(0.15, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.03);
      osc.connect(gain);
      gain.connect(masterBusNode);
      osc.start();
      osc.stop(audioContext.currentTime + 0.03);
    }

    recordMixBtn.addEventListener('click', () => {
      if (!audioContext || !mixDestinationNode) return alert('Bitte zuerst Engine entriegeln!');

      if (!isRecordingMix) {
        mixChunks = [];
        let options = {};
        if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4' };

        mixRecorder = new MediaRecorder(mixDestinationNode.stream, options);
        mixRecorder.ondataavailable = e => mixChunks.push(e.data);
        mixRecorder.onstop = () => {
          const blob = new Blob(mixChunks, { type: mixRecorder.mimeType || 'audio/mp4' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `loop-mix-${Date.now()}.mp4`;
          a.click();
        };

        mixRecorder.start();
        isRecordingMix = true;
        recordMixBtn.textContent = '⏹️ Stopp & Export';
        recordMixBtn.style.background = '#ff3b30';
      } else {
        mixRecorder.stop();
        isRecordingMix = false;
        recordMixBtn.textContent = '🔴 Mix Aufnehmen';
        recordMixBtn.style.background = '#007aff';
      }
    });
  </script>
</body>
</html>
